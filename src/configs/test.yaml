defaults:
  - writer: wandb
  - metrics: default
  - datasets: retail
  - dataloader: default
  - transforms: example
  - _self_

model:
  _target_: src.model.DeepFM
  embed_dim: 32
  user_feature_sizes: ${feature_sizes.user}
  item_feature_sizes: ${feature_sizes.item}

feature_sizes:
  user: ${oc.decode:${read_json:/Users/andreypetukhov/Documents/work-related/LightFM/data/user_feature_sizes.json}}
  item: ${oc.decode:${read_json:/Users/andreypetukhov/Documents/work-related/LightFM/data/item_feature_sizes.json}}

optimizer:
  _target_: torch.optim.AdamW
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 0.0005
  pct_start: 0.1
  steps_per_epoch: ${trainer.epoch_len}
  epochs: ${trainer.n_epochs}
  anneal_strategy: cos

loss_function:
  _target_: src.loss.LogitsBCELoss

trainer:
  log_step: 50
  n_epochs: 20
  epoch_len: null
  device_tensors: ["label", "text_encoded"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: True # if True, will override the previous run with the same name
  monitor: "min val_loss" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "deepspeech2"
  seed: 1
  max_grad_norm: 10
  # TODO: maybe add max_grad_norm
