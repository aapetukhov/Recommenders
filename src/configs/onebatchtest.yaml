defaults:
  - writer: tensorboard
  - metrics: default
  - datasets: small
  - dataloader: small
  - transforms: example
  - _self_

data:
  user_feature_sizes_path: /home/datalab/nfs/deepfm/data/train_10_coalesced/user_feature_sizes_10.json
  item_feature_sizes_path: /home/datalab/nfs/deepfm/data/train_10_coalesced/item_feature_sizes_10.json

model:
  _target_: src.models.DeepFM
  embed_dim: 128

optimizer:
  _target_: torch.optim.AdamW
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 0.0005
  pct_start: 0.1
  # steps_per_epoch: ${trainer.epoch_len}
  epochs: ${trainer.n_epochs}
  anneal_strategy: cos

loss_function:
  _target_: src.loss.LogitsBCELoss

trainer:
  log_step: 10
  n_epochs: 10
  # epoch_len: null
  device_tensors: ["user", "item", "label", "double_user", "double_item", "kt_emb", "dt_emb", "kt_topic_emb", "dt_topic_emb"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: True # if True, will override the previous run with the same name
  monitor: "min val_loss" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 2 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "deepfm_logs" # directory to save logs and checkpoints
  seed: 1
  max_grad_norm: 10
  # TODO: maybe add max_grad_norm
